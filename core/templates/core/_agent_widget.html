{% load ui %}
{# Плаваючий віджет «порадитись з агентом» — вставляється на кожну сторінку #}
<div id="agentw" class="agw"
     data-ask="{% url 'core:assistant_ask' %}"
     data-hist="{% url 'core:assistant_history' %}"
     data-clear="{% url 'core:assistant_clear' %}"
     data-src-db="{% t 'srcDb' %}"
     data-src-kb="{% t 'srcKb' %}"
     data-src-fallback="{% t 'srcFallback' %}"
     data-typing="{% t 'agentTyping' %}"
     data-err="{% t 'agentErr' %}"
     data-auth="{% if user.is_authenticated %}1{% else %}0{% endif %}">
  <div class="agw-panel" id="agw-panel" hidden role="dialog" aria-label="{% t 'agentOpen' %}">
    <div class="agw-head">
      <span class="agw-av">{% icon 'bot' %}</span>
      <div class="min"><b>{% t 'agentShort' %} · Learnova</b><small id="agw-status">{% t 'agentOnline' %}</small></div>
      <button class="ib agw-x" type="button" id="agw-close" aria-label="{% t 'agentClose' %}">{% icon 'close' %}</button>
    </div>
    <div class="agw-body" id="agw-body" aria-live="polite">
      <div class="msg a"><span class="msg-in">{% t 'agentHint' %}</span><span class="msg-src">{% t 'srcDb' %}</span></div>
    </div>
    <div class="agw-chips" id="agw-chips">
      {% for c in agent_chips %}<button type="button" class="chip js-agq">{{ c }}</button>{% endfor %}
    </div>
    <form class="agw-form" id="agw-form" autocomplete="off">
      <input id="agw-input" type="text" maxlength="400" placeholder="{% t 'askShort' %}" aria-label="{% t 'askShort' %}">
      <button class="b agw-send" type="submit" aria-label="{% t 'send' %}">{% icon 'send' %}</button>
    </form>
    <div class="agw-foot">
      <span>{% t 'agentNote' %}</span>
      <button type="button" class="agw-clear" id="agw-clear">{% t 'agentClear' %}</button>
    </div>
  </div>
  <button id="agw-fab" class="agw-fab" type="button" aria-expanded="false" aria-controls="agw-panel">
    {% icon 'bot' %}<span class="agw-lbl">{% t 'agentOpen' %}</span>
  </button>
</div>
